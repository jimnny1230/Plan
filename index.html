<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아기자기한 패드 인터페이스</title>
    <style>
        /* 폰트 정의 (제공된 교보손글씨 폰트명 반영) */
        @font-face {
            font-family: 'KyoboHandwriting';
            src: local('Kyobo Handwriting 2022 khn Regular'), local('KyoboHandwriting2022khn');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'KyoboHandwriting', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 패드 화면 프레임 (깔끔하고 아기자기한 디자인, 명암 제거) */
        .pad-container {
            width: 100%;
            max-width: 768px;
            height: 100%;
            max-height: 1024px;
            background-color: #ffffff;
            border: 4px solid #e2e8f0;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: relative;
        }

        /* 상단 헤더 영역 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #edf2f7;
        }

        h1 {
            font-size: 24px;
            color: #4a5568;
        }

        .font-selector {
            font-size: 14px;
            padding: 6px 12px;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            background: #fff;
            color: #4a5568;
            outline: none;
            cursor: pointer;
        }

        /* 메인 컨텐츠 영역 (화면 잘림 방지 및 유연한 배치) */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        /* 카드 컴포넌트 (명암 없이 깔끔한 테두리 중심) */
        .card {
            background-color: #fffaf0;
            border: 2px solid #feebc8;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-title {
            font-size: 18px;
            color: #d69e2e;
        }

        .card-desc {
            font-size: 14px;
            color: #718096;
            line-height: 1.4;
        }

        /* 텍스트와 드래그 버튼 겹침 해결을 위한 Flex 분리 배치 */
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 20px;
            gap: 16px;
        }

        .text-area {
            flex: 1;
            font-size: 15px;
            color: #2d3748;
            word-break: break-all;
        }

        /* 드래그/인터랙션 버튼 (겹침 방지 및 명확한 독립 공간 확보) */
        .action-btn {
            background-color: #68d391;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: #48bb78;
        }

        /* 하단 네비게이션 바 */
        footer {
            display: flex;
            justify-content: space-around;
            padding-top: 16px;
            border-top: 2px dashed #edf2f7;
        }

        .nav-item {
            background: none;
            border: none;
            font-size: 14px;
            color: #a0aec0;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 12px;
        }

        .nav-item.active {
            background-color: #ebf8ff;
            color: #3182ce;
        }

        /* =========================================================
           [+] 추가된 시간대별 공부 시간 비교 위젯 전용 스타일 (명암 없음)
           ========================================================= */
        .study-widget {
            background-color: #f0f9ff;
            border: 2px solid #bae6fd;
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .widget-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .widget-title {
            font-size: 18px;
            color: #0284c7;
        }

        /* 학교 간 날 / 안 간 날(휴일) 토글 버튼 */
        .school-toggle-btn {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid;
            transition: all 0.2s;
        }

        .school-toggle-btn.school-day {
            background-color: #ebf8ff;
            border-color: #63b3ed;
            color: #2b6cb0;
        }

        .school-toggle-btn.holiday-day {
            background-color: #fff5f5;
            border-color: #feb2b2;
            color: #c53030;
        }

        /* 비교 기준 선택 탭 (전날 / 전체 평균 / 등교·휴일 평균) */
        .compare-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .compare-tab {
            flex: 1;
            min-width: 90px;
            padding: 8px 10px;
            border-radius: 12px;
            border: 2px solid #cbd5e0;
            background-color: #ffffff;
            color: #718096;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }

        .compare-tab.active {
            border-color: #38bdf8;
            background-color: #e0f2fe;
            color: #0369a1;
            font-weight: bold;
        }

        /* 시간대별 비교 그래프 및 기록 행 */
        .slot-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slot-item {
            background-color: #ffffff;
            border: 2px solid #e0f2fe;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .slot-name {
            font-size: 15px;
            color: #2d3748;
        }

        .slot-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mini-btn {
            background-color: #edf2f7;
            border: 1px solid #cbd5e0;
            color: #4a5568;
            border-radius: 8px;
            padding: 3px 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .mini-btn:hover {
            background-color: #e2e8f0;
        }

        /* 듀얼 가로 막대 바 */
        .bar-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bar-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .bar-label {
            width: 54px;
            color: #718096;
            white-space: nowrap;
        }

        .bar-track {
            flex: 1;
            height: 10px;
            background-color: #f1f5f9;
            border-radius: 6px;
            overflow: hidden;
        }

        .bar-fill-today {
            height: 100%;
            background-color: #38bdf8;
            border-radius: 6px;
            transition: width 0.3s;
        }

        .bar-fill-base {
            height: 100%;
            background-color: #cbd5e0;
            border-radius: 6px;
            transition: width 0.3s;
        }

        .bar-val {
            width: 48px;
            text-align: right;
            color: #4a5568;
        }

        .diff-badge {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .diff-plus { background-color: #def7ec; color: #03543f; }
        .diff-minus { background-color: #fde8e8; color: #9b1c1c; }
        .diff-same { background-color: #f3f4f6; color: #4b5563; }

        .widget-summary {
            background-color: #ffffff;
            border: 2px dashed #bae6fd;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            color: #0369a1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="pad-container" id="appContainer">
        <!-- 상단 헤더 -->
        <header>
            <h1>아기자기 패드</h1>
            <select class="font-selector" id="fontSelector" onchange="changeFont(this.value)">
                <option value="KyoboHandwriting">교보손글씨체</option>
                <option value="Malgun Gothic">기본 고딕체</option>
            </select>
        </header>

        <!-- 메인 인터페이스 영역 -->
        <div class="main-content">
            <div class="card">
                <div class="card-title">✨ 환영합니다!</div>
                <div class="card-desc">명암을 없애고 화면에 딱 맞게 구성된 깔끔한 인터페이스입니다. 텍스트와 버튼이 겹치지 않도록 간격이 조정되었습니다.</div>
            </div>

            <!-- 텍스트와 버튼이 겹치지 않는 독립 배치 영역 1 -->
            <div class="control-row">
                <div class="text-area">
                    <strong>설정 확인:</strong> 현재 폰트와 레이아웃이 정상적으로 적용되어 있습니다.
                </div>
                <button class="action-btn" onclick="alert('버튼이 클릭되었습니다!')">선택하기</button>
            </div>

            <!-- 텍스트와 버튼이 겹치지 않는 독립 배치 영역 2 -->
            <div class="control-row">
                <div class="text-area">
                    <strong>인터페이스 조정:</strong> 패드 화면 크기에 맞추어 모든 요소가 한눈에 들어옵니다.
                </div>
                <button class="action-btn" style="background-color: #63b3ed;" onclick="alert('설정이 변경되었습니다!')">변경하기</button>
            </div>

            <!-- =========================================================
                 [+] 기존 화면 아래에 추가된 시간대별 공부 비교 위젯
                 ========================================================= -->
            <div class="study-widget">
                <div class="widget-top-bar">
                    <div class="widget-title">⏰ 시간대별 공부 비교 위젯</div>
                    <!-- 학교 간 날 / 안 간 날(휴일) 토글 버튼 -->
                    <button id="schoolDayBtn" class="school-toggle-btn school-day" onclick="toggleSchoolDay()">
                        🏫 학교 간 날 (등교일)
                    </button>
                </div>

                <!-- 비교 기준 선택 탭 -->
                <div class="compare-tabs">
                    <button class="compare-tab active" id="tab-prev" onclick="setCompareMode('prev')">전날 대비</button>
                    <button class="compare-tab" id="tab-avg" onclick="setCompareMode('avg')">전체 평균 대비</button>
                    <button class="compare-tab" id="tab-type" onclick="setCompareMode('type')">등교/휴일 평균 대비</button>
                </div>

                <!-- 시간대별 그래프 및 공부 시간 조절 리스트 -->
                <div class="slot-list" id="slotList"></div>

                <!-- 총합 요약 -->
                <div class="widget-summary" id="widgetSummary"></div>
            </div>
        </div>

        <!-- 하단 네비게이션 -->
        <footer>
            <button class="nav-item active">홈</button>
            <button class="nav-item">설정</button>
            <button class="nav-item">정보</button>
        </footer>
    </div>

    <script>
        // 기존 폰트 변경 함수
        function changeFont(fontName) {
            const container = document.getElementById('appContainer');
            if (fontName === 'KyoboHandwriting') {
                container.style.fontFamily = "'KyoboHandwriting', sans-serif";
            } else {
                container.style.fontFamily = "'Malgun Gothic', sans-serif";
            }
        }

        // =========================================================
        // [+] 추가된 시간대별 공부 시간 비교 위젯 스크립트
        // =========================================================
        const timeSlots = [
            { id: 'morning', label: '🌅 오전 (06~12시)' },
            { id: 'afternoon', label: '☀️ 오후 (12~18시)' },
            { id: 'evening', label: '🌆 저녁 (18~22시)' },
            { id: 'night', label: '🌙 심야 (22~02시)' }
        ];

        // 초기 상태 및 샘플 과거 기록 (학교 간 날: isSchoolDay = true, 학교 안 간 날/휴일: isSchoolDay = false)
        let isSchoolDay = true;
        let compareMode = 'prev'; // 'prev' | 'avg' | 'type'

        // 오늘 공부 시간 (분 단위)
        let todayMinutes = {
            morning: 60,
            afternoon: 90,
            evening: 120,
            night: 40
        };

        // 비교용 누적 기록 데이터 (전날 및 등교일/휴일 평균 산출용)
        const historyRecords = [
            { isSchoolDay: true,  morning: 40,  afternoon: 70,  evening: 130, night: 50 }, // 전날 (학교 간 날)
            { isSchoolDay: true,  morning: 50,  afternoon: 80,  evening: 110, night: 40 }, // 과거 학교 간 날
            { isSchoolDay: true,  morning: 30,  afternoon: 60,  evening: 140, night: 60 }, // 과거 학교 간 날
            { isSchoolDay: false, morning: 150, afternoon: 180, evening: 90,  night: 30 }, // 과거 학교 안 간 날 (휴일)
            { isSchoolDay: false, morning: 120, afternoon: 160, evening: 100, night: 40 }  // 과거 학교 안 간 날 (휴일)
        ];

        // 학교 간 날 / 안 간 날 전환
        function toggleSchoolDay() {
            isSchoolDay = !isSchoolDay;
            const btn = document.getElementById('schoolDayBtn');
            if (isSchoolDay) {
                btn.className = 'school-toggle-btn school-day';
                btn.textContent = '🏫 학교 간 날 (등교일)';
            } else {
                btn.className = 'school-toggle-btn holiday-day';
                btn.textContent = '🏡 학교 안 간 날 (휴일)';
            }
            renderStudyWidget();
        }

        // 비교 기준 탭 변경
        function setCompareMode(mode) {
            compareMode = mode;
            ['prev', 'avg', 'type'].forEach(m => {
                document.getElementById('tab-' + m).classList.toggle('active', m === mode);
            });
            renderStudyWidget();
        }

        // 오늘 시간대별 공부 시간 증감 (+/- 10분)
        function adjustMinutes(slotId, delta) {
            todayMinutes[slotId] = Math.max(0, todayMinutes[slotId] + delta);
            renderStudyWidget();
        }

        // 분을 'X시간 Y분' 또는 'Y분' 포맷으로 변환
        function formatMin(m) {
            const rounded = Math.round(m);
            if (rounded === 0) return '0분';
            const h = Math.floor(rounded / 60);
            const min = rounded % 60;
            if (h > 0 && min > 0) return `${h}시간 ${min}분`;
            if (h > 0) return `${h}시간`;
            return `${min}분`;
        }

        // 기준 데이터 계산
        function getBaselineData() {
            if (compareMode === 'prev') {
                return {
                    label: '전날',
                    data: historyRecords[0]
                };
            }
            if (compareMode === 'avg') {
                const avg = { morning: 0, afternoon: 0, evening: 0, night: 0 };
                historyRecords.forEach(r => {
                    timeSlots.forEach(s => avg[s.id] += r[s.id]);
                });
                timeSlots.forEach(s => avg[s.id] /= historyRecords.length);
                return {
                    label: '전체 평균',
                    data: avg
                };
            }
            // 'type': 현재 선택된 '학교 간 날' 또는 '학교 안 간 날(휴일)'과 같은 날들만 필터링
            const filtered = historyRecords.filter(r => r.isSchoolDay === isSchoolDay);
            const typeAvg = { morning: 0, afternoon: 0, evening: 0, night: 0 };
            filtered.forEach(r => {
                timeSlots.forEach(s => typeAvg[s.id] += r[s.id]);
            });
            timeSlots.forEach(s => typeAvg[s.id] /= filtered.length);
            return {
                label: isSchoolDay ? '등교일 평균' : '휴일 평균',
                data: typeAvg
            };
        }

        // 위젯 렌더링
        function renderStudyWidget() {
            const listEl = document.getElementById('slotList');
            const summaryEl = document.getElementById('widgetSummary');
            const baseline = getBaselineData();
            const maxScale = 240; // 막대 그래프 최대 기준 (4시간 = 240분)

            let totalToday = 0;
            let totalBase = 0;

            listEl.innerHTML = timeSlots.map(slot => {
                const tVal = todayMinutes[slot.id];
                const bVal = Math.round(baseline.data[slot.id]);
                totalToday += tVal;
                totalBase += bVal;

                const diff = tVal - bVal;
                let diffText = '동일';
                let diffClass = 'diff-same';
                if (diff > 0) {
                    diffText = `+${diff}분`;
                    diffClass = 'diff-plus';
                } else if (diff < 0) {
                    diffText = `${diff}분`;
                    diffClass = 'diff-minus';
                }

                const tPct = Math.min(100, (tVal / maxScale) * 100);
                const bPct = Math.min(100, (bVal / maxScale) * 100);

                return `
                    <div class="slot-item">
                        <div class="slot-header">
                            <span class="slot-name">${slot.label} <span class="diff-badge ${diffClass}">${diffText}</span></span>
                            <div class="slot-controls">
                                <button class="mini-btn" onclick="adjustMinutes('${slot.id}', -10)">-10분</button>
                                <button class="mini-btn" onclick="adjustMinutes('${slot.id}', 10)">+10분</button>
                            </div>
                        </div>
                        <div class="bar-group">
                            <div class="bar-line">
                                <span class="bar-label">오늘</span>
                                <div class="bar-track"><div class="bar-fill-today" style="width: ${tPct}%"></div></div>
                                <span class="bar-val">${tVal}분</span>
                            </div>
                            <div class="bar-line">
                                <span class="bar-label">${baseline.label}</span>
                                <div class="bar-track"><div class="bar-fill-base" style="width: ${bPct}%"></div></div>
                                <span class="bar-val">${bVal}분</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const totalDiff = totalToday - totalBase;
            const sign = totalDiff > 0 ? '+' : '';
            summaryEl.innerHTML = `
                <span>오늘 총 공부: <strong>${formatMin(totalToday)}</strong></span>
                <span>${baseline.label} 대비: <strong>${sign}${totalDiff}분</strong></span>
            `;
        }

        // 초기 실행
        renderStudyWidget();
    </script>
</body>
</html>
