<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아기자기 공부 시간대 비교 플래너</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 교보손글씨체 웹폰트 및 로컬 폰트 정의 */
        @font-face {
            font-family: 'KyoboHandwriting2022khn';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/KyoboHandwriting2022khn.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --current-font: 'KyoboHandwriting2022khn', 'Malgun Gothic', sans-serif;
        }

        * {
            box-sizing: border-box;
            font-family: var(--current-font);
        }

        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a5568;
            /* 가로 스크롤 방지 */
            overflow-x: hidden;
        }

        /* 패드 화면 비율(768x1024)에 최적화된 컨테이너 - 그림자 없이 깔끔한 테두리 */
        .pad-frame {
            width: 100%;
            max-width: 768px;
            height: 100vh;
            max-height: 1024px;
            background-color: #ffffff;
            border: 4px solid #e2e8f0;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .pad-frame {
                border-radius: 0;
                border-width: 0;
                max-height: none;
                height: 100dvh;
            }
        }

        /* 커스텀 스크롤바 (얇고 아기자기하게) */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f8fafc;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* 파스텔 플랫 버튼 스타일 (명암 제거, 테두리 강조) */
        .pastel-btn {
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .pastel-btn:active {
            transform: scale(0.97);
        }

        /* 애니메이션 바 */
        .bar-fill {
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body>

    <div class="pad-frame" id="appRoot">
        <!-- 1. 상단 헤더 영역: 날짜 이동, 등교 여부 토글, 폰트 선택 -->
        <header class="px-5 py-4 bg-[#fffdf9] border-b-2 border-dashed border-[#e2e8f0] flex flex-wrap items-center justify-between gap-3 shrink-0">
            <!-- 날짜 선택 컨트롤 -->
            <div class="flex items-center gap-2 bg-white border-2 border-[#cbd5e1] rounded-2xl px-3 py-1.5">
                <button onclick="changeDate(-1)" class="pastel-btn px-2 py-1 rounded-xl bg-[#f1f5f9] hover:bg-[#e2e8f0] text-sm font-bold text-[#475569]" title="이전 날짜">◀</button>
                <div class="flex flex-col items-center min-w-[115px]">
                    <span id="displayDate" class="text-base font-bold text-[#334155]">2026.11.20 (금)</span>
                    <span id="dateBadge" class="text-xs text-[#94a3b8]">오늘</span>
                </div>
                <button onclick="changeDate(1)" class="pastel-btn px-2 py-1 rounded-xl bg-[#f1f5f9] hover:bg-[#e2e8f0] text-sm font-bold text-[#475569]" title="다음 날짜">▶</button>
            </div>

            <!-- 등교 여부 (학교 간 날 / 안 간 날) 토글 버튼 -->
            <div class="flex items-center gap-2">
                <button id="schoolToggleBtn" onclick="toggleSchoolDay()" class="pastel-btn flex items-center gap-2 px-4 py-2 rounded-2xl border-2 font-bold text-sm">
                    <span id="schoolIcon">🏫</span>
                    <span id="schoolStatusText">학교 간 날</span>
                </button>

                <!-- 폰트 변경 셀렉터 -->
                <select id="fontSelector" onchange="changeFont(this.value)" class="border-2 border-[#cbd5e1] rounded-2xl px-3 py-2 text-sm bg-white text-[#475569] outline-none cursor-pointer">
                    <option value="'KyoboHandwriting2022khn', sans-serif">교보손글씨</option>
                    <option value="'Malgun Gothic', sans-serif">기본 고딕</option>
                </select>
            </div>
        </header>

        <!-- 2. 상단 요약 & 실시간 타이머 바 (텍스트와 버튼이 절대 겹치지 않는 독립 구조) -->
        <section class="px-5 py-3 bg-[#f8fafc] border-b-2 border-[#e2e8f0] flex flex-wrap items-center justify-between gap-3 shrink-0">
            <!-- 오늘 총 공부 시간 요약 -->
            <div class="flex items-center gap-3">
                <div class="bg-[#fef3c7] border-2 border-[#fde68a] rounded-2xl px-4 py-2 flex items-center gap-2">
                    <span class="text-lg">⏱️</span>
                    <div>
                        <div class="text-xs text-[#b45309]">선택일 총 공부</div>
                        <div id="totalStudyTimeText" class="text-lg font-bold text-[#92400e]">0시간 0분</div>
                    </div>
                </div>
            </div>

            <!-- 미니 스톱워치 타이머 (현재 시간대에 자동 누적) -->
            <div class="flex items-center gap-2 bg-white border-2 border-[#bae6fd] rounded-2xl px-3 py-2">
                <div class="flex flex-col pr-2">
                    <span class="text-xs text-[#0284c7]" id="timerSlotLabel">오후 (12~18시) 측정</span>
                    <span id="stopwatchDisplay" class="text-base font-bold text-[#0369a1] tracking-wider">00:00:00</span>
                </div>
                <button id="timerToggleBtn" onclick="toggleTimer()" class="pastel-btn px-3 py-2 rounded-xl bg-[#38bdf8] text-white text-sm font-bold hover:bg-[#0284c7]">
                    시작
                </button>
                <button onclick="saveTimerToSlot()" class="pastel-btn px-3 py-2 rounded-xl bg-[#a7f3d0] text-[#065f46] border border-[#6ee7b7] text-sm font-bold hover:bg-[#6ee7b7]" title="측정된 분을 기록에 반영">
                    반영
                </button>
            </div>
        </section>

        <!-- 3. 메인 스크롤 영역 (시간대별 비교 차트 + 시간대별 기록 입력) -->
        <main class="flex-1 overflow-y-auto custom-scroll p-5 space-y-5">

            <!-- [핵심 기능] 시간대별 공부 시간 비교 카드 -->
            <div class="bg-[#fffaf0] border-2 border-[#fed7aa] rounded-3xl p-5 space-y-4">
                <!-- 카드 상단: 제목 + 비교 기준 선택 탭 (겹침 방지를 위해 flex-wrap 및 gap 확보) -->
                <div class="flex flex-wrap items-center justify-between gap-3 border-b-2 border-dashed border-[#ffedd5] pb-3">
                    <div>
                        <h2 class="text-lg font-bold text-[#c2410c] flex items-center gap-1.5">
                            <span>📊</span> 시간대별 공부 시간 비교
                        </h2>
                        <p id="compareSubtitle" class="text-xs text-[#9a3412] mt-0.5">전날(어제) 공부 기록과 비교하고 있어요</p>
                    </div>

                    <!-- 비교 기준 선택 버튼 그룹 -->
                    <div class="flex flex-wrap gap-1.5 bg-white p-1.5 rounded-2xl border-2 border-[#fed7aa]">
                        <button onclick="setCompareMode('yesterday')" id="tab-yesterday" class="pastel-btn px-3 py-1.5 rounded-xl text-xs font-bold">
                            전날 대비
                        </button>
                        <button onclick="setCompareMode('allAvg')" id="tab-allAvg" class="pastel-btn px-3 py-1.5 rounded-xl text-xs font-bold">
                            전체 평균
                        </button>
                        <button onclick="setCompareMode('typeAvg')" id="tab-typeAvg" class="pastel-btn px-3 py-1.5 rounded-xl text-xs font-bold">
                            등교/휴일 평균
                        </button>
                    </div>
                </div>

                <!-- 범례 표시 -->
                <div class="flex flex-wrap items-center justify-between gap-2 text-xs px-1">
                    <div class="flex items-center gap-4">
                        <span class="flex items-center gap-1.5 font-bold text-[#ea580c]">
                            <span class="w-3 h-3 rounded-full bg-[#fb923c] inline-block"></span> 선택일 기록
                        </span>
                        <span class="flex items-center gap-1.5 font-bold text-[#64748b]">
                            <span class="w-3 h-3 rounded-full bg-[#cbd5e1] inline-block"></span> <span id="legendCompareLabel">전날 기록</span>
                        </span>
                    </div>
                    <div id="totalDiffBadge" class="px-2.5 py-1 rounded-xl bg-white border border-[#fed7aa] font-bold text-[#c2410c]">
                        총 +0분 차이
                    </div>
                </div>

                <!-- 시간대별 듀얼 가로 막대 그래프 컨테이너 -->
                <div id="comparisonChartContainer" class="space-y-3 pt-1">
                    <!-- JS에서 4개 시간대(오전, 오후, 저녁, 심야) 그래프 렌더링 -->
                </div>
            </div>

            <!-- [기록 입력] 시간대별 공부 시간 직접 조절 카드 -->
            <div class="bg-[#f0fdf4] border-2 border-[#bbf7d0] rounded-3xl p-5 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-dashed border-[#dcfce7] pb-3">
                    <div>
                        <h2 class="text-lg font-bold text-[#15803d] flex items-center gap-1.5">
                            <span>✏️</span> 시간대별 공부 기록 입력
                        </h2>
                        <p class="text-xs text-[#166534] mt-0.5">버튼을 눌러 시간대별 공부 시간(분)을 간편하게 추가/수정하세요</p>
                    </div>
                    <button onclick="resetSampleData()" class="pastel-btn px-3 py-1.5 rounded-xl bg-white border-2 border-[#bbf7d0] text-xs font-bold text-[#15803d] hover:bg-[#dcfce7]">
                        예시 데이터 복원
                    </button>
                </div>

                <!-- 4개 시간대 입력 리스트 (텍스트와 조작 버튼 완벽 분리) -->
                <div id="timeSlotsInputContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- JS에서 렌더링 -->
                </div>
            </div>

        </main>

        <!-- 4. 하단 안내 메시지 바 (alert() 대신 사용하는 토스트/상태 영역) -->
        <footer class="px-5 py-3 bg-[#f8fafc] border-t-2 border-dashed border-[#e2e8f0] flex items-center justify-between text-xs text-[#64748b] shrink-0">
            <span id="statusMessage">💡 주말은 자동으로 '학교 안 간 날(휴일)'로 설정되며, 상단 버튼으로 언제든 변경할 수 있어요!</span>
            <span class="font-bold text-[#94a3b8] hidden sm:inline">자동 저장됨</span>
        </footer>
    </div>

    <script>
        /**
         * 시간대 정의 (하루를 4개의 주요 학습 시간대로 구분)
         */
        const TIME_SLOTS = [
            { id: 'morning', label: '오전 (06~12시)', icon: '🌅', maxMins: 360 },
            { id: 'afternoon', label: '오후 (12~18시)', icon: '☀️', maxMins: 360 },
            { id: 'evening', label: '저녁 (18~22시)', icon: '🌆', maxMins: 240 },
            { id: 'night', label: '심야 (22~02시)', icon: '🌙', maxMins: 240 }
        ];

        const STORAGE_KEY = 'cute_pad_study_planner_v1';

        // 애플리케이션 상태
        let state = {
            selectedDate: getTodayStr(),
            compareMode: 'yesterday', // 'yesterday' | 'allAvg' | 'typeAvg'
            records: {} // { 'YYYY-MM-DD': { isSchoolDay: boolean, slots: { morning: number, ... } } }
        };

        // 스톱워치 상태
        let timerInterval = null;
        let timerSeconds = 0;

        /**
         * 날짜 유틸리티 함수들
         */
        function getTodayStr() {
            const now = new Date();
            return formatDateStr(now);
        }

        function formatDateStr(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function parseDateStr(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function getDayOfWeekKor(dateStr) {
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            return days[parseDateStr(dateStr).getDay()];
        }

        function isWeekend(dateStr) {
            const day = parseDateStr(dateStr).getDay();
            return day === 0 || day === 6; // 일요일(0) 또는 토요일(6)
        }

        function getOffsetDateStr(dateStr, offsetDays) {
            const d = parseDateStr(dateStr);
            d.setDate(d.getDate() + offsetDays);
            return formatDateStr(d);
        }

        function formatMinutes(mins) {
            const rounded = Math.round(mins);
            if (rounded === 0) return '0분';
            const h = Math.floor(rounded / 60);
            const m = rounded % 60;
            if (h > 0 && m > 0) return `${h}시간 ${m}분`;
            if (h > 0) return `${h}시간`;
            return `${m}분`;
        }

        /**
         * 초기 예시 데이터 생성 (최근 5일치 등교일/휴일 데이터 세팅)
         */
        function createDefaultSampleData() {
            const today = getTodayStr();
            const sample = {};

            // 최근 5일간의 현실적인 공부 기록 생성
            const offsets = [-4, -3, -2, -1, 0];
            offsets.forEach((offset) => {
                const dStr = getOffsetDateStr(today, offset);
                const weekend = isWeekend(dStr);
                const isSchool = !weekend; // 평일은 학교 간 날, 주말은 휴일(안 간 날)

                if (offset === 0) {
                    // 오늘 데이터
                    sample[dStr] = {
                        isSchoolDay: isSchool,
                        slots: isSchool
                            ? { morning: 40, afternoon: 60, evening: 130, night: 50 }
                            : { morning: 120, afternoon: 150, evening: 90, night: 40 }
                    };
                } else if (isSchool) {
                    // 평일(학교 간 날) 예시: 오후/저녁 위주 공부
                    sample[dStr] = {
                        isSchoolDay: true,
                        slots: {
                            morning: 30 + ((Math.abs(offset) * 10) % 30),
                            afternoon: 50 + ((Math.abs(offset) * 15) % 40),
                            evening: 140 + ((Math.abs(offset) * 20) % 50),
                            night: 60 + ((Math.abs(offset) * 10) % 30)
                        }
                    };
                } else {
                    // 휴일(학교 안 간 날) 예시: 오전/오후 집중 공부
                    sample[dStr] = {
                        isSchoolDay: false,
                        slots: {
                            morning: 140 + ((Math.abs(offset) * 15) % 40),
                            afternoon: 180 + ((Math.abs(offset) * 20) % 50),
                            evening: 100 + ((Math.abs(offset) * 10) % 40),
                            night: 50
                        }
                    };
                }
            });

            return sample;
        }

        /**
         * 로컬 스토리지 로드 및 저장
         */
        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    state.records = JSON.parse(saved);
                } else {
                    state.records = createDefaultSampleData();
                    saveData();
                }
            } catch (e) {
                console.error('데이터 로드 오류:', e);
                state.records = createDefaultSampleData();
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records));
            } catch (e) {
                console.error('데이터 저장 오류:', e);
            }
        }

        /**
         * 특정 날짜의 레코드 가져오기 (없으면 주말 여부에 맞춰 자동 초기화)
         */
        function getOrCreateRecord(dateStr) {
            if (!state.records[dateStr]) {
                state.records[dateStr] = {
                    isSchoolDay: !isWeekend(dateStr),
                    slots: { morning: 0, afternoon: 0, evening: 0, night: 0 }
                };
                saveData();
            }
            return state.records[dateStr];
        }

        /**
         * 안내 메시지 표시 (alert 대체)
         */
        function showToast(msg) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.classList.add('text-[#0284c7]', 'font-bold');
            setTimeout(() => {
                el.classList.remove('text-[#0284c7]', 'font-bold');
            }, 2500);
        }

        /**
         * 폰트 변경
         */
        function changeFont(fontVal) {
            document.documentElement.style.setProperty('--current-font', fontVal);
            showToast('✨ 글꼴이 변경되었습니다.');
        }

        /**
         * 날짜 변경
         */
        function changeDate(offset) {
            state.selectedDate = getOffsetDateStr(state.selectedDate, offset);
            renderAll();
        }

        /**
         * 등교 여부(학교 간 날 / 안 간 날) 수동 토글
         */
        function toggleSchoolDay() {
            const rec = getOrCreateRecord(state.selectedDate);
            rec.isSchoolDay = !rec.isSchoolDay;
            saveData();
            renderAll();
            const label = rec.isSchoolDay ? '🏫 학교 간 날(등교일)' : '🏡 학교 안 간 날(휴일)';
            showToast(`${state.selectedDate} 날짜가 '${label}'로 설정되었습니다.`);
        }

        /**
         * 비교 기준 변경 ('yesterday' | 'allAvg' | 'typeAvg')
         */
        function setCompareMode(mode) {
            state.compareMode = mode;
            renderAll();
        }

        /**
         * 시간대별 공부 시간(분) 증감
         */
        function adjustSlotMinutes(slotId, deltaMins) {
            const rec = getOrCreateRecord(state.selectedDate);
            const current = rec.slots[slotId] || 0;
            const nextVal = Math.max(0, Math.min(360, current + deltaMins));
            rec.slots[slotId] = nextVal;
            saveData();
            renderAll();
        }

        /**
         * 비교 기준 데이터 계산 로직
         */
        function calculateComparisonBaseline() {
            const currentRec = getOrCreateRecord(state.selectedDate);
            const baselineSlots = { morning: 0, afternoon: 0, evening: 0, night: 0 };
            let subtitle = '';
            let legendLabel = '';

            if (state.compareMode === 'yesterday') {
                const prevDate = getOffsetDateStr(state.selectedDate, -1);
                const prevRec = state.records[prevDate];
                subtitle = `전날(${prevDate}, ${getDayOfWeekKor(prevDate)}) 기록과 비교하고 있어요`;
                legendLabel = `전날 (${prevDate.slice(5)})`;

                if (prevRec) {
                    TIME_SLOTS.forEach(s => {
                        baselineSlots[s.id] = prevRec.slots[s.id] || 0;
                    });
                }
            } else if (state.compareMode === 'allAvg') {
                // 선택일을 제외한 모든 기록된 날짜의 평균 (기록이 선택일뿐이면 선택일 포함)
                const allDates = Object.keys(state.records);
                const otherDates = allDates.filter(d => d !== state.selectedDate);
                const targetDates = otherDates.length > 0 ? otherDates : allDates;

                subtitle = `저장된 전체 ${targetDates.length}일 평균 공부 시간과 비교하고 있어요`;
                legendLabel = `전체 평균 (${targetDates.length}일)`;

                targetDates.forEach(d => {
                    const r = state.records[d];
                    TIME_SLOTS.forEach(s => {
                        baselineSlots[s.id] += (r.slots[s.id] || 0);
                    });
                });

                if (targetDates.length > 0) {
                    TIME_SLOTS.forEach(s => {
                        baselineSlots[s.id] = Math.round(baselineSlots[s.id] / targetDates.length);
                    });
                }
            } else if (state.compareMode === 'typeAvg') {
                // 동일한 등교 여부(학교 간 날 vs 안 간 날) 평균 계산
                const targetType = currentRec.isSchoolDay;
                const typeName = targetType ? '학교 간 날(등교일)' : '학교 안 간 날(휴일)';
                const allDates = Object.keys(state.records).filter(d => state.records[d].isSchoolDay === targetType);
                const otherSameType = allDates.filter(d => d !== state.selectedDate);
                const targetDates = otherSameType.length > 0 ? otherSameType : allDates;

                subtitle = `다른 '${typeName}' ${targetDates.length}일 평균과 비교하고 있어요`;
                legendLabel = `${targetType ? '등교일' : '휴일'} 평균`;

                targetDates.forEach(d => {
                    const r = state.records[d];
                    TIME_SLOTS.forEach(s => {
                        baselineSlots[s.id] += (r.slots[s.id] || 0);
                    });
                });

                if (targetDates.length > 0) {
                    TIME_SLOTS.forEach(s => {
                        baselineSlots[s.id] = Math.round(baselineSlots[s.id] / targetDates.length);
                    });
                }
            }

            return { baselineSlots, subtitle, legendLabel };
        }

        /**
         * 전체 UI 렌더링
         */
        function renderAll() {
            const currentRec = getOrCreateRecord(state.selectedDate);
            const todayStr = getTodayStr();

            // 1. 헤더 날짜 표시
            const formattedDate = state.selectedDate.replace(/-/g, '.');
            const dow = getDayOfWeekKor(state.selectedDate);
            document.getElementById('displayDate').textContent = `${formattedDate} (${dow})`;

            const badgeEl = document.getElementById('dateBadge');
            if (state.selectedDate === todayStr) {
                badgeEl.textContent = '오늘';
                badgeEl.className = 'text-xs font-bold text-[#0284c7]';
            } else if (state.selectedDate === getOffsetDateStr(todayStr, -1)) {
                badgeEl.textContent = '어제';
                badgeEl.className = 'text-xs font-bold text-[#64748b]';
            } else {
                badgeEl.textContent = isWeekend(state.selectedDate) ? '주말' : '평일';
                badgeEl.className = 'text-xs text-[#94a3b8]';
            }

            // 2. 등교 여부 토글 버튼 스타일 업데이트
            const schoolBtn = document.getElementById('schoolToggleBtn');
            const schoolIcon = document.getElementById('schoolIcon');
            const schoolText = document.getElementById('schoolStatusText');

            if (currentRec.isSchoolDay) {
                schoolBtn.className = 'pastel-btn flex items-center gap-2 px-4 py-2 rounded-2xl border-2 border-[#93c5fd] bg-[#eff6ff] text-[#1d4ed8] font-bold text-sm';
                schoolIcon.textContent = '🏫';
                schoolText.textContent = '학교 간 날 (등교)';
            } else {
                schoolBtn.className = 'pastel-btn flex items-center gap-2 px-4 py-2 rounded-2xl border-2 border-[#fca5a5] bg-[#fef2f2] text-[#b91c1c] font-bold text-sm';
                schoolIcon.textContent = '🏡';
                schoolText.textContent = '학교 안 간 날 (휴일)';
            }

            // 3. 총 공부 시간 계산
            let totalMins = 0;
            TIME_SLOTS.forEach(s => {
                totalMins += (currentRec.slots[s.id] || 0);
            });
            document.getElementById('totalStudyTimeText').textContent = formatMinutes(totalMins);

            // 4. 비교 탭 버튼 활성화 상태 업데이트
            ['yesterday', 'allAvg', 'typeAvg'].forEach(mode => {
                const tabBtn = document.getElementById(`tab-${mode}`);
                if (state.compareMode === mode) {
                    tabBtn.className = 'pastel-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-[#fb923c] text-white';
                } else {
                    tabBtn.className = 'pastel-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-transparent text-[#9a3412] hover:bg-[#ffedd5]';
                }
            });

            // 5. 비교 차트 렌더링
            renderComparisonChart(currentRec);

            // 6. 시간대별 입력 카드 렌더링
            renderInputSlots(currentRec);
        }

        /**
         * 시간대별 가로 듀얼 막대 차트 렌더링
         */
        function renderComparisonChart(currentRec) {
            const { baselineSlots, subtitle, legendLabel } = calculateComparisonBaseline();
            document.getElementById('compareSubtitle').textContent = subtitle;
            document.getElementById('legendCompareLabel').textContent = legendLabel;

            const container = document.getElementById('comparisonChartContainer');
            container.innerHTML = '';

            // 차트 스케일 계산 (최대 240분 기준, 더 큰 값이 있으면 확장)
            let maxVal = 180;
            TIME_SLOTS.forEach(s => {
                maxVal = Math.max(maxVal, currentRec.slots[s.id] || 0, baselineSlots[s.id] || 0);
            });

            let totalCurrent = 0;
            let totalBaseline = 0;

            TIME_SLOTS.forEach(slot => {
                const curMin = currentRec.slots[slot.id] || 0;
                const baseMin = baselineSlots[slot.id] || 0;
                totalCurrent += curMin;
                totalBaseline += baseMin;

                const diff = curMin - baseMin;
                const curPct = Math.min(100, Math.round((curMin / maxVal) * 100));
                const basePct = Math.min(100, Math.round((baseMin / maxVal) * 100));

                // 증감 배지 텍스트 및 색상
                let diffText = '0분';
                let diffClass = 'bg-[#f1f5f9] text-[#64748b] border-[#cbd5e1]';
                if (diff > 0) {
                    diffText = `+${diff}분 ▲`;
                    diffClass = 'bg-[#dcfce7] text-[#15803d] border-[#86efac]';
                } else if (diff < 0) {
                    diffText = `${diff}분 ▼`;
                    diffClass = 'bg-[#fee2e2] text-[#b91c1c] border-[#fca5a5]';
                }

                const rowHtml = `
                    <div class="bg-white border-2 border-[#ffedd5] rounded-2xl p-3.5 space-y-2">
                        <!-- 상단: 시간대 이름과 증감 배지 (겹침 방지 독립 배치) -->
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <span class="text-base">${slot.icon}</span>
                                <span class="font-bold text-sm text-[#334155]">${slot.label}</span>
                            </div>
                            <span class="px-2.5 py-0.5 rounded-xl border text-xs font-bold ${diffClass}">
                                ${diffText}
                            </span>
                        </div>

                        <!-- 듀얼 막대 영역 -->
                        <div class="space-y-1.5">
                            <!-- 선택일 막대 -->
                            <div class="flex items-center gap-3">
                                <div class="flex-1 h-4 bg-[#fff7ed] rounded-full overflow-hidden border border-[#ffedd5]">
                                    <div class="bar-fill h-full bg-[#fb923c] rounded-full" style="width: ${curPct}%"></div>
                                </div>
                                <span class="w-16 text-right text-xs font-bold text-[#ea580c] shrink-0">${formatMinutes(curMin)}</span>
                            </div>

                            <!-- 비교 기준 막대 -->
                            <div class="flex items-center gap-3">
                                <div class="flex-1 h-3.5 bg-[#f8fafc] rounded-full overflow-hidden border border-[#e2e8f0]">
                                    <div class="bar-fill h-full bg-[#cbd5e1] rounded-full" style="width: ${basePct}%"></div>
                                </div>
                                <span class="w-16 text-right text-xs font-bold text-[#64748b] shrink-0">${formatMinutes(baseMin)}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', rowHtml);
            });

            // 총합 차이 배지 업데이트
            const totalDiff = totalCurrent - totalBaseline;
            const totalBadge = document.getElementById('totalDiffBadge');
            if (totalDiff > 0) {
                totalBadge.textContent = `총 +${formatMinutes(totalDiff)} 더 공부함! 🎉`;
                totalBadge.className = 'px-3 py-1 rounded-xl bg-[#dcfce7] border border-[#86efac] font-bold text-[#15803d] text-xs';
            } else if (totalDiff < 0) {
                totalBadge.textContent = `총 ${formatMinutes(Math.abs(totalDiff))} 덜 공부함`;
                totalBadge.className = 'px-3 py-1 rounded-xl bg-[#fee2e2] border border-[#fca5a5] font-bold text-[#b91c1c] text-xs';
            } else {
                totalBadge.textContent = '기준 시간과 동일해요';
                totalBadge.className = 'px-3 py-1 rounded-xl bg-white border border-[#fed7aa] font-bold text-[#c2410c] text-xs';
            }
        }

        /**
         * 시간대별 공부 시간 입력 카드 렌더링 (텍스트와 버튼이 절대 겹치지 않게 설계)
         */
        function renderInputSlots(currentRec) {
            const container = document.getElementById('timeSlotsInputContainer');
            container.innerHTML = '';

            TIME_SLOTS.forEach(slot => {
                const mins = currentRec.slots[slot.id] || 0;
                const cardHtml = `
                    <div class="bg-white border-2 border-[#bbf7d0] rounded-2xl p-3.5 flex items-center justify-between gap-3">
                        <!-- 좌측 텍스트 정보 영역 -->
                        <div class="min-w-0">
                            <div class="flex items-center gap-1.5">
                                <span>${slot.icon}</span>
                                <span class="font-bold text-sm text-[#1e293b] truncate">${slot.label}</span>
                            </div>
                            <div class="text-base font-bold text-[#15803d] mt-1">
                                ${formatMinutes(mins)}
                            </div>
                        </div>

                        <!-- 우측 독립 조작 버튼 그룹 -->
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button onclick="adjustSlotMinutes('${slot.id}', -10)" class="pastel-btn px-2.5 py-2 rounded-xl bg-[#fee2e2] text-[#b91c1c] border border-[#fca5a5] text-xs font-bold hover:bg-[#fecaca]">
                                -10분
                            </button>
                            <button onclick="adjustSlotMinutes('${slot.id}', 10)" class="pastel-btn px-2.5 py-2 rounded-xl bg-[#dcfce7] text-[#15803d] border border-[#86efac] text-xs font-bold hover:bg-[#bbf7d0]">
                                +10분
                            </button>
                            <button onclick="adjustSlotMinutes('${slot.id}', 30)" class="pastel-btn px-2.5 py-2 rounded-xl bg-[#bbf7d0] text-[#14532d] border border-[#4ade80] text-xs font-bold hover:bg-[#86efac]">
                                +30분
                            </button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        /**
         * 실시간 스톱워치 기능 (현재 시각에 해당하는 시간대 자동 판별)
         */
        function getCurrentTimeSlotId() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 12) return 'morning';
            if (hour >= 12 && hour < 18) return 'afternoon';
            if (hour >= 18 && hour < 22) return 'evening';
            return 'night';
        }

        function updateTimerSlotLabel() {
            const slotId = getCurrentTimeSlotId();
            const slot = TIME_SLOTS.find(s => s.id === slotId);
            document.getElementById('timerSlotLabel').textContent = `${slot.label} 측정`;
        }

        function toggleTimer() {
            const btn = document.getElementById('timerToggleBtn');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.textContent = '계속';
                btn.className = 'pastel-btn px-3 py-2 rounded-xl bg-[#38bdf8] text-white text-sm font-bold hover:bg-[#0284c7]';
            } else {
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    updateStopwatchDisplay();
                }, 1000);
                btn.textContent = '일시정지';
                btn.className = 'pastel-btn px-3 py-2 rounded-xl bg-[#fb923c] text-white text-sm font-bold hover:bg-[#ea580c]';
            }
        }

        function updateStopwatchDisplay() {
            const h = String(Math.floor(timerSeconds / 3600)).padStart(2, '0');
            const m = String(Math.floor((timerSeconds % 3600) / 60)).padStart(2, '0');
            const s = String(timerSeconds % 60).padStart(2, '0');
            document.getElementById('stopwatchDisplay').textContent = `${h}:${m}:${s}`;
        }

        function saveTimerToSlot() {
            const addedMins = Math.max(1, Math.round(timerSeconds / 60));
            if (timerSeconds === 0) {
                showToast('⏱️ 먼저 타이머를 시작해 주세요!');
                return;
            }
            const slotId = getCurrentTimeSlotId();
            const slot = TIME_SLOTS.find(s => s.id === slotId);

            // 오늘 날짜의 해당 시간대에 반영
            state.selectedDate = getTodayStr();
            adjustSlotMinutes(slotId, addedMins);

            // 타이머 초기화
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerSeconds = 0;
            updateStopwatchDisplay();
            const btn = document.getElementById('timerToggleBtn');
            btn.textContent = '시작';
            btn.className = 'pastel-btn px-3 py-2 rounded-xl bg-[#38bdf8] text-white text-sm font-bold hover:bg-[#0284c7]';

            showToast(`🎉 ${slot.label}에 ${addedMins}분이 반영되었습니다!`);
        }

        /**
         * 예시 데이터 복원
         */
        function resetSampleData() {
            state.records = createDefaultSampleData();
            state.selectedDate = getTodayStr();
            saveData();
            renderAll();
            showToast('🔄 최근 5일간의 예시 데이터가 복원되었습니다!');
        }

        // 초기 실행
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            updateTimerSlotLabel();
            renderAll();
        });
    </script>
</body>
</html>
